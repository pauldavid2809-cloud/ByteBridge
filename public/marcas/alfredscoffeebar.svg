<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad-alfredscoffeebar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#140C08" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="stroke-alfredscoffeebar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#140C08" rx="60" />
  <circle cx="200" cy="200" r="160" fill="url(#grad-alfredscoffeebar)" />

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#stroke-alfredscoffeebar)" stroke-width="6" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#D97706" stroke-width="2.5" opacity="0.8" />

  <!-- Initials Badge -->
  <text x="200" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
    AC
  </text>

  <!-- Subtitle -->
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FBBF24" letter-spacing="4">
    COFFEE BAR
  </text>
</svg>